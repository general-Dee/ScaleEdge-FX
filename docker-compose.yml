version: '3.8'
services:
  postgres:
    image: postgres:14
    container_name: scaleedge-postgres
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scaleedge_fx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: scaleedge-redis
    ports:
      - "6379:6379"
volumes:
  postgres_data:
